[milvus]
uri = "~/.memsearch/milvus.db"
token = ""
collection = "zith_chunks"

[embedding]
provider = "onnx"
model = "gpahal/bge-m3-onnx-int8"
batch_size = 0
base_url = ""
api_key = ""

[chunking]
max_chunk_size = 1500
overlap_lines = 2

[indexing]
ignore_files = []
exclude = []

[watch]
debounce_ms = 1500
