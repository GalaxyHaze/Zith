<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="{{baseurl}}/docs/">
    <!-- include:head -->
    <title>Zith Documentation &mdash; Guide, Reference &amp; CLI</title>
    <link rel="icon" type="image/png" href="{{baseurl}}/media/Logos/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{baseurl}}/media/Logos/logo.png">
    <link rel="canonical" href="https://zith-lang.org/docs/D-home.html">

    <meta name="robots" content="index, follow">
    <meta name="author" content="GalaxyHaze">
    <meta name="description" content="Language guide, language reference, specification, and CLI documentation for the Zith programming language.">
    <meta name="keywords" content="Zith documentation, systems programming language, zithc, language guide, language reference, CLI reference">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zith-lang.org/docs/D-home.html">
    <meta property="og:title" content="Zith Documentation &mdash; Guide, Reference &amp; CLI">
    <meta property="og:description" content="Language guide, language reference, specification, and CLI documentation for Zith.">
    <meta property="og:image" content="https://zith-lang.org/media/Logos/social-share.png">
    <meta property="og:site_name" content="Zith Programming Language">
    <meta property="og:locale" content="en_US">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:domain" content="zith-lang.org">
    <meta name="twitter:title" content="Zith Documentation &mdash; Guide, Reference &amp; CLI">
    <meta name="twitter:description" content="Language guide, language reference, specification, and CLI documentation for Zith.">
    <meta name="twitter:image" content="https://zith-lang.org/media/Logos/social-share.png">

    <link rel="stylesheet" href="{{baseurl}}/css/fonts.css">
    <link rel="stylesheet" href="{{baseurl}}/css/tokens.css">
    <link rel="stylesheet" href="{{baseurl}}/css/base.css">
    <link rel="stylesheet" href="{{baseurl}}/css/header.css">
    <link rel="stylesheet" href="{{baseurl}}/css/footer.css">
    <link rel="stylesheet" href="{{baseurl}}/css/docs.css">
</head>
<body class="docs" data-docs-scope="neutral" data-docs-base="{{baseurl}}/docs/" data-tree-url="{{baseurl}}/json/tree.json">

<!-- include:header active="docs" -->

<div class="docs-layout container">
    <aside class="docs-sidebar" id="sidebar" aria-label="Documentation navigation"></aside>
    <main class="docs-main">
        <nav class="docs-language-switcher" aria-label="Documentation language">
            <a href="{{baseurl}}/docs/zith/" data-docs-language="zith">Zith</a>
            <a href="{{baseurl}}/docs/zith--/" data-docs-language="zith--">Zith--</a>
        </nav>
        <p class="docs-switch-notice" id="docsSwitchNotice"
           role="status" aria-live="polite" hidden></p>
        <div class="docs-page-toolbar">
            <p class="docs-filebar" id="filebarPath">_</p>
            <div class="docs-toolbar-actions">
                <button class="button button-secondary docs-edit-link" id="editPageButton"
                        type="button" hidden>Edit locally</button>
                <a class="docs-source-link" id="editPageLink" href="#" target="_blank"
                   rel="noopener noreferrer" hidden>Edit on GitHub</a>
            </div>
        </div>
        <div class="docs-content" id="content"></div>
    </main>
</div>

<!-- include:footer -->

<script defer src="{{baseurl}}/js/zith-highlight.js"></script>
<script defer src="{{baseurl}}/js/docs-routing.js"></script>
<script defer src="{{baseurl}}/js/docs-markdown.js"></script>
<script defer src="{{baseurl}}/js/loadTree.js"></script>
<script defer src="{{baseurl}}/js/docs-editor.js"></script>
</body>
</html>
