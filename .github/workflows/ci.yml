name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 lld-18 llvm-18-dev \
            libclang-18-dev pkg-config

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DZITH_HAS_LLVM=ON \
            -DZITH_REQUIRE_LLVM=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify LLVM configuration
        run: python3 scripts/verify-llvm-build.py --build-dir build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 lld-18 llvm-18-dev \
            libclang-18-dev pkg-config

      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DZITH_HAS_LLVM=ON \
            -DZITH_REQUIRE_LLVM=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Verify LLVM configuration
        run: python3 scripts/verify-llvm-build.py --build-dir build-sanitized

      - name: Build
        run: cmake --build build-sanitized -j$(nproc)

      - name: Test under ASan and UBSan
        working-directory: build-sanitized
        run: ctest --output-on-failure

  cross-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            wasm_test: false
          - name: wasm-runtime
            wasm_test: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.65

      - name: Configure and Build MUSL (Static)
        run: |
          # Build the static musl compiler inside Alpine so the C++ runtime and
          # the LLVM archives come from the same musl environment. Linking the
          # host glibc LLVM archives into a musl target leaves libstdc++
          # symbols (std::__cxx11::basic_string, std::__once_callable, and
          # friends) unresolved, which is the failure this job used to hit.
          docker run --rm \
            --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            alpine:3.22 \
            sh -euc '
              apk add --no-cache build-base cmake ninja python3 git \
                clang20 llvm20-dev llvm20-static llvm20-gtest lld20 \
                zlib-static zstd-static

              compiler_target="$(clang-20 --print-target-triple)"
              case "$compiler_target" in
                x86_64*musl*) ;;
                *)
                  echo "Unexpected musl compiler target: $compiler_target" >&2
                  exit 1
                  ;;
              esac

              zlib_archive="$(find /usr/lib -name libz.a -print -quit)"
              test -n "$zlib_archive" && test -f "$zlib_archive"

              cmake -S . -B build-musl -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF \
                -DZITH_ENABLE_STRICT_WARNINGS=OFF \
                -DZITH_ENABLE_C_COMPILE=OFF \
                -DZITH_ENABLE_C_INTEROP=OFF \
                -DCMAKE_C_COMPILER=clang-20 \
                -DCMAKE_CXX_COMPILER=clang++-20 \
                -DCMAKE_C_COMPILER_TARGET="$compiler_target" \
                -DCMAKE_CXX_COMPILER_TARGET="$compiler_target" \
                -DLLVM_DIR="$(llvm-config-20 --cmakedir)" \
                -DZITH_HAS_LLVM=ON \
                -DZITH_REQUIRE_LLVM=ON \
                -DZLIB_USE_STATIC_LIBS=ON \
                -DZLIB_LIBRARY="$zlib_archive" \
                -DCMAKE_EXE_LINKER_FLAGS="-static -lc" \
                -DCMAKE_CXX_FLAGS="-fno-cxx-exceptions"

              zlib_cache="$(sed -n "s/^ZLIB_LIBRARY:[^=]*=//p" build-musl/CMakeCache.txt)"
              if [ "$zlib_cache" != "$zlib_archive" ]; then
                echo "CMake selected $zlib_cache instead of $zlib_archive" >&2
                exit 1
              fi
              case "$zlib_cache" in
                *.a) ;;
                *)
                  echo "CMake did not select a static zlib archive: $zlib_cache" >&2
                  exit 1
                  ;;
              esac

              python3 scripts/verify-llvm-build.py \
                --build-dir build-musl \
                --expected-target "$compiler_target"
              cmake --build build-musl -j"$(nproc)"
            '

      - name: Configure and Build WebAssembly
        run: |
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CROSSCOMPILING=ON \
            -DZITH_IS_WASM=ON
          cmake --build build-wasm -j$(nproc)
          python3 scripts/package-stdlib.py stdlib build-wasm/zith-stdlib.pack

      - name: Test WASM runtime ABI
        if: matrix.wasm_test
        run: node tests/test-wasm-runtime.mjs build-wasm/zith-playground.wasm build-wasm/zith-stdlib.pack

      - name: Check documentation consistency
        run: python3 scripts/check-docs-consistency.py

      - name: Validate release contracts
        run: >-
          python3 scripts/validate-release-contract.py
          --manifest .github/scoop/bucket/zithc.json
          --workflow-dir .github/workflows
          --allow-empty-hashes

      - name: Test release metadata generators
        run: python3 scripts/test-release-contract.py
