name: Build Artifact

concurrency:
  group: build-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag para a Release (ex: v1.0.0)'
        required: false
        default: ''
      draft:
        description: 'Create release as draft'
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: false
      draft:
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  CMAKE_VERSION: '3.28.x'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - id: meta
        name: Resolve tag and draft mode
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.event.inputs.tag_name || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected vMAJOR.MINOR.PATCH[.REVISION]."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          DRAFT="true"
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            if [ "${{ inputs.draft }}" = "true" ]; then DRAFT="true"; else DRAFT="false"; fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.draft }}" = "true" ]; then DRAFT="true"; else DRAFT="false"; fi
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "create_draft=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.event_name != 'workflow_call'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          draft: ${{ steps.meta.outputs.create_draft }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-arm64-llvm:
    name: Build LLVM 20.1.8 (Windows ARM64, all codegen targets)
    runs-on: windows-11-arm
    timeout-minutes: 240
    env:
      LLVM_VERSION: '20.1.8'
    steps:
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Install LLVM ARM64 host compiler
        shell: pwsh
        run: |
          $llvmVersion = '20.1.8'
          $assetName = "clang+llvm-$llvmVersion-aarch64-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP $assetName
          $releaseTag = 'llvm' + 'org' + [char]45 + $llvmVersion
          $assetUri = "https://github.com/llvm/llvm-project/releases/download/$releaseTag/$assetName"
          Invoke-WebRequest -Uri $assetUri -OutFile $archive

          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-arm64-host'
          New-Item -ItemType Directory -Path $llvmRoot -Force | Out-Null
          tar.exe -xf $archive -C $llvmRoot --strip-components=1
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract LLVM host compiler: $assetName"
          }
          $clangCl = Join-Path $llvmRoot 'bin\clang-cl.exe'
          if (-not (Test-Path $clangCl)) {
            throw "LLVM ARM64 archive did not contain clang-cl.exe: $assetName"
          }
          $clangVersion = & $clangCl --version | Select-Object -First 1
          if ($clangVersion -notmatch '^clang version 20\.') {
            throw "Expected Clang 20 from LLVM archive; got: $clangVersion"
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Restore full-backend LLVM package
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\llvm-arm64-20.1.8-full
          key: llvm-windows-arm64-20.1.8-aarch64-x86-webassembly-v1

      - name: Checkout pinned LLVM sources
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $llvmTag = 'llvmorg' + [char]45 + $env:LLVM_VERSION
          git clone --depth 1 --branch $llvmTag https://github.com/llvm/llvm-project.git llvm-project

      - name: Build LLVM with all compiler codegen targets
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-arm64-host'
          $installRoot = Join-Path $env:RUNNER_TEMP 'llvm-arm64-20.1.8-full'
          $clangCl = Join-Path $llvmRoot 'bin\clang-cl.exe'
          $cmakeCompilerPath = $clangCl -replace '\\', '/'
          $cmakeInstallPath = $installRoot -replace '\\', '/'
          cmake -S llvm-project/llvm -B llvm-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$cmakeCompilerPath" `
            "-DCMAKE_CXX_COMPILER=$cmakeCompilerPath" `
            "-DCMAKE_INSTALL_PREFIX=$cmakeInstallPath" `
            '-DLLVM_TARGETS_TO_BUILD=AArch64;X86;WebAssembly' `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_BUILD_UTILS=OFF `
            -DLLVM_BUILD_TESTS=OFF `
            -DLLVM_BUILD_EXAMPLES=OFF `
            -DLLVM_BUILD_BENCHMARKS=OFF `
            -DLLVM_BUILD_DOCS=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_ENABLE_BINDINGS=OFF `
            -DLLVM_ENABLE_LIBEDIT=OFF `
            -DLLVM_ENABLE_LIBXML2=OFF `
            -DLLVM_ENABLE_RTTI=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_BUILD_LLVM_DYLIB=OFF `
            -DLLVM_LINK_LLVM_DYLIB=OFF
          if ($LASTEXITCODE -ne 0) {
            throw "LLVM ARM64 CMake configuration failed with exit code $LASTEXITCODE"
          }

          cmake --build llvm-build --target install --parallel 4
          if ($LASTEXITCODE -ne 0) {
            throw "LLVM ARM64 build/install failed with exit code $LASTEXITCODE"
          }

      - name: Verify full-backend LLVM package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-arm64-20.1.8-full'
          $requiredLibraries = @(
            'LLVMX86CodeGen.lib',
            'LLVMAArch64CodeGen.lib',
            'LLVMWebAssemblyCodeGen.lib'
          )
          foreach ($library in $requiredLibraries) {
            $path = Join-Path $llvmRoot "lib\$library"
            if (-not (Test-Path $path)) {
              throw "Full-backend LLVM package is missing $path"
            }
          }
          if (-not (Test-Path (Join-Path $llvmRoot 'lib\cmake\llvm\LLVMConfig.cmake'))) {
            throw 'Full-backend LLVM package is missing LLVMConfig.cmake'
          }

      - name: Upload full-backend LLVM package
        uses: actions/upload-artifact@v4
        with:
          name: llvm-windows-arm64-full-backends
          path: ${{ runner.temp }}\llvm-arm64-20.1.8-full
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-main:
    needs: [create-release, build-windows-arm64-llvm]
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: zithc-linux-amd64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER=ld.lld

          - os: ubuntu-24.04-arm
            target_name: zithc-linux-arm64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER=ld.lld

          - os: macos-15
            target_name: zithc-macos-arm64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=$(xcrun -f clang)
              -DCMAKE_CXX_COMPILER=$(xcrun -f clang++)
              -DCMAKE_AR=$(xcrun -f ar)
              -DCMAKE_RANLIB=$(xcrun -f ranlib)
              -DCMAKE_EXE_LINKER_FLAGS=-Wl,-headerpad_max_install_names
              -DLLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm

          - os: macos-15-intel
            target_name: zithc-macos-amd64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=$(xcrun -f clang)
              -DCMAKE_CXX_COMPILER=$(xcrun -f clang++)
              -DCMAKE_AR=$(xcrun -f ar)
              -DCMAKE_RANLIB=$(xcrun -f ranlib)
              -DCMAKE_EXE_LINKER_FLAGS=-Wl,-headerpad_max_install_names
              -DLLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm

          - os: windows-latest
            target_name: zithc-windows-amd64.exe
            msvc_arch: amd64
            llvm_asset: win64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang-cl
              -DCMAKE_CXX_COMPILER=clang-cl
              -DCMAKE_PREFIX_PATH="C:/Program Files/LLVM"
              -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"

          - os: windows-11-arm
            target_name: zithc-windows-arm64.exe
            msvc_arch: arm64
            llvm_asset: woa64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang-cl
              -DCMAKE_CXX_COMPILER=clang-cl
              -DCMAKE_PREFIX_PATH="C:/Program Files/LLVM"
              -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"
              -DCMAKE_C_COMPILER_TARGET=arm64-pc-windows-msvc
              -DCMAKE_CXX_COMPILER_TARGET=arm64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 lld-18 llvm-18-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm ninja

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Legacy LLVM installer (disabled)
        if: false
        shell: pwsh
        run: |
          choco install ninja -y
          $llvmVersion = '18.1.8'
          $llvmAsset = '${{ matrix.llvm_asset }}'
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$llvmVersion-$llvmAsset.exe"
          if ($llvmAsset -eq 'win64') {
          Invoke-WebRequest `
            -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-win64.exe" `
            -OutFile $installer
          } else {
            $releaseTag = 'llvm' + 'org' + [char]45 + $llvmVersion
            $assetName = "LLVM-$llvmVersion-$llvmAsset.exe"
            $installerUri = "https://github.com/llvm/llvm-project/releases/download/$releaseTag/$assetName"
            Invoke-WebRequest -Uri $installerUri -OutFile $installer
          }
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/S', '/D=C:\Program Files\LLVM' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($process.ExitCode)"
          }

      - name: Install Windows ARM64 dependencies
        if: false
        shell: pwsh
        run: |
          choco install ninja -y
          $llvmVersion = '18.1.8'
          $releaseTag = 'llvm' + 'org' + [char]45 + $llvmVersion
          $assetName = "LLVM-$llvmVersion-woa64.exe"
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          $installerUri = "https://github.com/llvm/llvm-project/releases/download/$releaseTag/$assetName"
          Invoke-WebRequest -Uri $installerUri -OutFile $installer
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/S', '/D=C:\Program Files\LLVM' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "LLVM ARM64 installer failed with exit code $($process.ExitCode)"
          }

      - name: Install Windows LLVM development archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmVersion = '20.1.8'
          $llvmArch = switch ('${{ matrix.llvm_asset }}') {
            'win64' { 'x86_64' }
            'woa64' { 'aarch64' }
            default { throw "Unsupported LLVM Windows asset: ${{ matrix.llvm_asset }}" }
          }
          $assetName = "clang+llvm-$llvmVersion-$llvmArch-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP $assetName
          $releaseTag = 'llvm' + 'org' + [char]45 + $llvmVersion
          $assetUri = "https://github.com/llvm/llvm-project/releases/download/$releaseTag/$assetName"
          Invoke-WebRequest -Uri $assetUri -OutFile $archive

          $llvmRoot = 'C:\Program Files\LLVM'
          Remove-Item -LiteralPath $llvmRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $llvmRoot -Force | Out-Null
          tar.exe -xf $archive -C $llvmRoot --strip-components=1
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract LLVM archive: $assetName"
          }
          if (-not (Test-Path (Join-Path $llvmRoot 'bin\clang-cl.exe'))) {
            throw "LLVM archive did not contain clang-cl.exe: $assetName"
          }
          if (-not (Test-Path (Join-Path $llvmRoot 'lib\cmake\llvm\LLVMConfig.cmake'))) {
            throw "LLVM archive did not contain LLVMConfig.cmake: $assetName"
          }
          $clangVersion = & (Join-Path $llvmRoot 'bin\clang-cl.exe') --version |
            Select-Object -First 1
          if ($clangVersion -notmatch '^clang version 20\.') {
            throw "Expected Clang 20 from LLVM archive; got: $clangVersion"
          }

      - name: Download full-backend LLVM package
        if: matrix.os == 'windows-11-arm'
        uses: actions/download-artifact@v4
        with:
          name: llvm-windows-arm64-full-backends
          path: ${{ runner.temp }}\llvm-arm64-full

      - name: Merge full-backend LLVM package
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'llvm-arm64-full'
          $destination = 'C:\Program Files\LLVM'
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force
          foreach ($library in @(
            'LLVMX86CodeGen.lib',
            'LLVMAArch64CodeGen.lib',
            'LLVMWebAssemblyCodeGen.lib'
          )) {
            $path = Join-Path $destination "lib\$library"
            if (-not (Test-Path $path)) {
              throw "Merged LLVM package is missing $path"
            }
          }

      - name: Add LLVM to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"

      - name: Locate LLVM CMake package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files\LLVM',
            'C:\Program Files (x86)\LLVM',
            'C:\ProgramData\chocolatey\lib\llvm\tools',
            (Join-Path $env:ChocolateyInstall 'lib\llvm\tools')
          )
          $config = $null
          foreach ($root in $roots) {
            $candidate = Join-Path $root 'lib\cmake\llvm\LLVMConfig.cmake'
            if (Test-Path $candidate) {
              $config = Get-Item $candidate
              break
            }
          }
          if ($null -eq $config) {
            $llvmConfig = Get-Command llvm-config.exe -ErrorAction SilentlyContinue
            if ($null -ne $llvmConfig) {
              $cmakeDir = (& $llvmConfig.Source --cmakedir).Trim()
              $candidate = Join-Path $cmakeDir 'LLVMConfig.cmake'
              if (Test-Path $candidate) {
                $config = Get-Item $candidate
              }
            }
          }
          if ($null -ne $config) {
            "LLVM_DIR=$($config.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Using LLVM_DIR=$($config.DirectoryName)"
          } else {
            Write-Host 'LLVMConfig.cmake was not found; CMake will use CMAKE_PREFIX_PATH and llvm-config discovery'
          }

      - name: Setup MSVC environment
        if: runner.os == 'Windows' && matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Expose DIA SDK at LLVM's configured path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.msvc_arch }}'
          $source = Join-Path $env:VSINSTALLDIR "DIA SDK\lib\$arch\diaguids.lib"
          if (-not (Test-Path $source)) {
            throw "DIA SDK library was not found at $source"
          }

          $pattern = '(?i)[A-Za-z]:[/\\][^"]*?diaguids\.lib'
          $diaDestinations = @(
            Get-ChildItem -LiteralPath $env:LLVM_DIR -Filter '*.cmake' -File -Recurse |
              Select-String -Pattern $pattern |
              ForEach-Object {
                foreach ($match in $_.Matches) {
                  $match.Value -replace '/', '\'
                }
              }
          ) | Sort-Object -Unique
          if ($diaDestinations.Count -eq 0) {
            throw "LLVM CMake exports did not contain a DIA SDK library path under $env:LLVM_DIR"
          }

          foreach ($destination in $diaDestinations) {
            $sourcePath = [System.IO.Path]::GetFullPath($source)
            $destinationPath = [System.IO.Path]::GetFullPath($destination)
            if ($sourcePath.Equals(
                $destinationPath,
                [System.StringComparison]::OrdinalIgnoreCase
              )) {
              Write-Host "LLVM DIA SDK library already at configured path: $sourcePath"
              continue
            }

            $destinationDir = Split-Path -Parent $destination
            New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Force
            Write-Host "LLVM DIA SDK library: $source -> $destination"
          }

      - name: Verify Clang
        shell: bash
        run: |
          clang --version
          clang++ --version

      - name: Clean stale build artifacts
        shell: bash
        run: rm -rf build

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DZITH_ENABLE_STRICT_WARNINGS=OFF \
            -DZITH_ENABLE_C_COMPILE=OFF \
            -DZITH_HAS_LLVM=ON \
            -DZITH_REQUIRE_LLVM=ON \
            -DZITH_VERSION=${{ needs.create-release.outputs.tag || inputs.tag_name }} \
            ${{ matrix.cmake_flags }}

      - name: Verify LLVM configuration
        shell: bash
        run: python3 scripts/verify-llvm-build.py --build-dir build

      - name: Clean stale macOS archives (prevent corruption)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -f build/lib/*.a build/*.a 2>/dev/null || true

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp build/zithc "artifacts/${{ matrix.target_name }}"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp build/zithc.exe "artifacts/${{ matrix.target_name }}"
          else
            chmod +x build/zithc
            cp build/zithc "artifacts/${{ matrix.target_name }}"
          fi

      - name: Stage macOS compiler for runtime packaging
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.target_name }}
          path: artifacts/${{ matrix.target_name }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload release asset
        if: runner.os != 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag || inputs.tag_name }}
          files: artifacts/${{ matrix.target_name }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-musl:
    # build-main is a matrix job; this gate waits for its Linux x64 artifact and
    # the rest of the native artifacts before spending time on musl builds.
    needs: [create-release, build-windows-arm64-llvm, build-main]
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: zithc-linux-amd64-musl
            container_platform: linux/amd64
            target_arch: x86_64

          - os: ubuntu-24.04-arm
            target_name: zithc-linux-arm64-musl
            container_platform: linux/arm64
            target_arch: aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        shell: bash
        run: |
          docker run --rm \
            --platform "${{ matrix.container_platform }}" \
            --env "ZITH_VERSION=${{ needs.create-release.outputs.tag || inputs.tag_name }}" \
            --env "ZITH_TARGET_ARCH=${{ matrix.target_arch }}" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            alpine:3.22 \
            sh -euc '
              apk add --no-cache build-base cmake ninja python3 git \
                clang20 llvm20-dev llvm20-static llvm20-gtest lld20 \
                zlib-static zstd-static

              compiler_target="$(clang-20 --print-target-triple)"
              case "$ZITH_TARGET_ARCH:$compiler_target" in
                x86_64:x86_64*musl*|aarch64:aarch64*musl*) ;;
                *)
                  echo "Unexpected musl compiler target: $compiler_target" >&2
                  exit 1
                  ;;
              esac

              zlib_archive="$(find /usr/lib -name libz.a -print -quit)"
              test -n "$zlib_archive" && test -f "$zlib_archive"

              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF \
                -DZITH_ENABLE_STRICT_WARNINGS=OFF \
                -DZITH_ENABLE_C_COMPILE=OFF \
                -DZITH_ENABLE_C_INTEROP=OFF \
                -DZITH_VERSION="$ZITH_VERSION" \
                -DCMAKE_C_COMPILER=clang-20 \
                -DCMAKE_CXX_COMPILER=clang++-20 \
                -DCMAKE_C_COMPILER_TARGET="$compiler_target" \
                -DCMAKE_CXX_COMPILER_TARGET="$compiler_target" \
                -DLLVM_DIR="$(llvm-config-20 --cmakedir)" \
                -DZITH_HAS_LLVM=ON \
                -DZITH_REQUIRE_LLVM=ON \
                -DZLIB_USE_STATIC_LIBS=ON \
                -DZLIB_LIBRARY="$zlib_archive" \
                -DCMAKE_EXE_LINKER_FLAGS="-static -lc" \
                -DCMAKE_CXX_FLAGS="-fno-cxx-exceptions"

              zlib_cache="$(sed -n 's/^ZLIB_LIBRARY:[^=]*=//p' build/CMakeCache.txt)"
              if [ "$zlib_cache" != "$zlib_archive" ]; then
                echo "CMake selected '$zlib_cache' instead of '$zlib_archive'" >&2
                exit 1
              fi
              case "$zlib_cache" in
                *.a) ;;
                *)
                  echo "CMake did not select a static zlib archive: $zlib_cache" >&2
                  exit 1
                  ;;
              esac

              python3 scripts/verify-llvm-build.py \
                --build-dir build \
                --expected-target "$compiler_target"
              cmake --build build --config Release
              mkdir -p artifacts
              cp build/zithc "artifacts/${{ matrix.target_name }}"
            '

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag || inputs.tag_name }}
          files: artifacts/${{ matrix.target_name }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-stdlib:
    needs: create-release
    name: Package stdlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stdlib archives
        shell: bash
        run: |
          mkdir -p artifacts
          TAG="${{ needs.create-release.outputs.tag || inputs.tag_name }}"
          cd stdlib
          tar czf "../artifacts/zithc-stdlib-${TAG}.tar.gz" .
          zip -r "../artifacts/zithc-stdlib-${TAG}.zip" .
          cd ..

      - name: Upload stdlib release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag || inputs.tag_name }}
          files: artifacts/zithc-stdlib-*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-release-assets:
    needs: [create-release, build-main, build-musl, package-stdlib, build-lsp, build-wasm]
    name: Validate release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all expected release assets
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.tag || inputs.tag_name || github.ref_name }}"
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "zithc-linux-amd64" \
            --pattern "zithc-linux-arm64" \
            --pattern "zithc-linux-amd64-musl" \
            --pattern "zithc-linux-arm64-musl" \
            --pattern "zithc-macos-amd64" \
            --pattern "zithc-macos-arm64" \
            --pattern "zith-macos-runtime-amd64.tar.gz" \
            --pattern "zith-macos-runtime-arm64.tar.gz" \
            --pattern "zithc-windows-amd64.exe" \
            --pattern "zithc-windows-arm64.exe" \
            --pattern "zithc-stdlib-${TAG}.tar.gz" \
            --pattern "zithc-stdlib-${TAG}.zip" \
            --pattern "zithc-wasm.zip" \
            --pattern "zith-lsp-linux-amd64" \
            --pattern "zith-lsp-linux-arm64" \
            --pattern "zith-lsp-macos-amd64" \
            --pattern "zith-lsp-macos-arm64" \
            --pattern "zith-lsp-windows-amd64.exe" \
            --pattern "zith-lsp-windows-arm64.exe" \
            --dir release-assets

          python3 scripts/validate-release-assets.py \
            --release-dir release-assets \
            --tag "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-published-windows:
    needs: [create-release, publish-release]
    name: Smoke-test published Windows downloads
    runs-on: windows-latest
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify anonymous published downloads and installers
        shell: pwsh
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('GITHUB_TOKEN', 'GH_TOKEN', 'ZITH_RELEASE_BASE_URL')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }

          $expectedTag = $env:EXPECTED_RELEASE_TAG
          $latest = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/GalaxyHaze/Zith-Lang/releases/latest'
          if ($latest.tag_name -cne $expectedTag) {
            throw "Latest release is '$($latest.tag_name)', expected '$expectedTag'"
          }

          $directDownload = Join-Path $env:RUNNER_TEMP 'zithc-windows-amd64.exe'
          $directUrl = "https://github.com/GalaxyHaze/Zith-Lang/releases/download/$expectedTag/zithc-windows-amd64.exe"
          Invoke-WebRequest -Uri $directUrl -OutFile $directDownload
          if (-not (Test-Path $directDownload) -or (Get-Item $directDownload).Length -le 0) {
            throw 'The versioned Windows compiler download is empty'
          }

          $installer = Join-Path $env:GITHUB_WORKSPACE 'scripts/install.ps1'
          $source = Join-Path $env:GITHUB_WORKSPACE 'examples/loops-simple.zith'

          $versionedRoot = Join-Path $env:RUNNER_TEMP 'zith-versioned'
          $env:ZITH_INSTALL_ROOT = $versionedRoot
          & $installer -Version $expectedTag
          $versionedCompiler = Join-Path $versionedRoot 'bin/zithc.exe'
          $versionedStdlib = Join-Path $versionedRoot 'share/zith/stdlib/std/io/console.zith'
          if (-not (Test-Path $versionedCompiler) -or -not (Test-Path $versionedStdlib)) {
            throw 'The versioned installer did not install the compiler and stdlib'
          }
          & $versionedCompiler check $source
          if ($LASTEXITCODE -ne 0) {
            throw "The versioned compiler smoke check failed with exit code $LASTEXITCODE"
          }

          $latestRoot = Join-Path $env:RUNNER_TEMP 'zith-latest'
          $env:ZITH_INSTALL_ROOT = $latestRoot
          & $installer
          $latestCompiler = Join-Path $latestRoot 'bin/zithc.exe'
          $latestStdlib = Join-Path $latestRoot 'share/zith/stdlib/std/io/console.zith'
          if (-not (Test-Path $latestCompiler) -or -not (Test-Path $latestStdlib)) {
            throw 'The latest installer did not install the compiler and stdlib'
          }
          & $latestCompiler check $source
          if ($LASTEXITCODE -ne 0) {
            throw "The latest compiler smoke check failed with exit code $LASTEXITCODE"
          }

  release-maintenance:
    needs: [create-release, validate-release-assets]
    name: Smoke installers and update release metadata
    uses: ./.github/workflows/release-maintenance.yml
    with:
      release_tag: ${{ needs.create-release.outputs.tag }}
      source_ref: ${{ github.sha }}
      run_install_smokes: true
    secrets: inherit
    permissions:
      contents: write

  smoke-scoop:
    needs: [create-release, release-maintenance]
    name: Smoke Scoop manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: false

      - name: Set up Scoop
        shell: pwsh
        env:
          CI: true
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $installExitCode = $LASTEXITCODE

          $scoopShims = Join-Path $env:USERPROFILE "scoop\shims"
          $scoopCommand = Join-Path $scoopShims "scoop.ps1"
          if (-not (Test-Path -LiteralPath $scoopCommand)) {
            throw "Scoop installation did not create its command shim"
          }
          $scoopShims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$scoopShims;$env:PATH"
          if ($null -ne $installExitCode -and $installExitCode -ne 0) {
            exit $installExitCode
          }

      - name: Validate Scoop is available
        shell: pwsh
        run: scoop --version

      - name: Set up Python for local asset server
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install and run Scoop package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          $bucket = Join-Path $env:RUNNER_TEMP "zith-scoop-local"
          $bucketManifest = Join-Path $bucket "bucket"
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE ".github\scoop\bucket\zithc.json"
          $assetDirectory = Join-Path $env:RUNNER_TEMP "zith-scoop-assets"
          $stdlibAsset = "zithc-stdlib-$($env:RELEASE_TAG).zip"
          New-Item -ItemType Directory -Path $bucketManifest -Force | Out-Null
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null

          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "zithc-windows-amd64.exe" `
            --pattern $stdlibAsset `
            --dir $assetDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download draft release assets for Scoop smoke test"
          }
          foreach ($asset in @("zithc-windows-amd64.exe", $stdlibAsset)) {
            if (-not (Test-Path -LiteralPath (Join-Path $assetDirectory $asset))) {
              throw "Release asset was not downloaded: $asset"
            }
          }

          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          $env:PYTHONUNBUFFERED = "1"
          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback, 0
          )
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $server = $null

          try {
            $server = Start-Process -FilePath "python" `
              -ArgumentList @(
                "-m", "http.server", "$port",
                "--bind", "127.0.0.1",
                "--directory", $assetDirectory
              ) `
              -PassThru -WindowStyle Hidden

            $assetBaseUrl = "http://127.0.0.1:$port"
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($server.HasExited) {
                throw "Local asset server exited before becoming ready"
              }
              try {
                Invoke-WebRequest -Uri "$assetBaseUrl/$stdlibAsset" `
                  -Method Head -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Local asset server did not become ready"
            }

            $localManifest = Get-Content -LiteralPath $manifestPath -Raw |
              ConvertFrom-Json
            $localManifest.architecture.'64bit'.url = @(
              "$assetBaseUrl/zithc-windows-amd64.exe",
              "$assetBaseUrl/$stdlibAsset"
            )
            $manifest = Join-Path $bucketManifest "zithc.json"
            $localManifest |
              ConvertTo-Json -Depth 20 |
              Set-Content -LiteralPath $manifest -Encoding utf8

            git -C $bucket init --quiet
            if ($LASTEXITCODE -ne 0) {
              throw "Could not initialize the local Scoop bucket repository"
            }
            git -C $bucket add bucket/zithc.json
            if ($LASTEXITCODE -ne 0) {
              throw "Could not stage the local Scoop manifest"
            }
            git -C $bucket -c "user.name=github-actions[bot]" `
              -c "user.email=41898282+github-actions[bot]@users.noreply.github.com" `
              commit --quiet -m "Add Zith Scoop manifest"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not commit the local Scoop manifest"
            }

            $bucketUri = ([System.Uri](Resolve-Path -LiteralPath $bucket).Path).AbsoluteUri
            scoop bucket add zith-local $bucketUri
            if ($LASTEXITCODE -ne 0) {
              throw "Could not add the local Scoop bucket"
            }
            scoop install zithc
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop could not install the release package"
            }
            zithc --help | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop-installed compiler failed to start"
            }
            zithc check examples\loops-simple.zith
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop-installed compiler failed the language smoke test"
            }
          } finally {
            if ($null -ne $server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
              Wait-Process -Id $server.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
          }

  build-lsp:
    needs: [create-release, build-windows-arm64-llvm, build-main]
    name: Build zith-lsp-${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-amd64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER=ld.lld

          - os: ubuntu-24.04-arm
            target_name: linux-arm64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_LINKER=ld.lld

          - os: macos-15
            target_name: macos-arm64
            runtime_arch: arm64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=$(xcrun -f clang)
              -DCMAKE_CXX_COMPILER=$(xcrun -f clang++)
              -DCMAKE_AR=$(xcrun -f ar)
              -DCMAKE_RANLIB=$(xcrun -f ranlib)
              -DCMAKE_EXE_LINKER_FLAGS=-Wl,-headerpad_max_install_names
              -DLLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm

          - os: macos-15-intel
            target_name: macos-amd64
            runtime_arch: amd64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=$(xcrun -f clang)
              -DCMAKE_CXX_COMPILER=$(xcrun -f clang++)
              -DCMAKE_AR=$(xcrun -f ar)
              -DCMAKE_RANLIB=$(xcrun -f ranlib)
              -DCMAKE_EXE_LINKER_FLAGS=-Wl,-headerpad_max_install_names
              -DLLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm

          - os: windows-latest
            target_name: windows-amd64.exe
            msvc_arch: amd64
            llvm_asset: win64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang-cl
              -DCMAKE_CXX_COMPILER=clang-cl
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCMAKE_PREFIX_PATH="C:/Program Files/LLVM"
              -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"

          - os: windows-11-arm
            target_name: windows-arm64.exe
            msvc_arch: arm64
            llvm_asset: woa64
            cmake_flags: >-
              -DCMAKE_C_COMPILER=clang-cl
              -DCMAKE_CXX_COMPILER=clang-cl
              -DCMAKE_PREFIX_PATH="C:/Program Files/LLVM"
              -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"
              -DCMAKE_C_COMPILER_TARGET=arm64-pc-windows-msvc
              -DCMAKE_CXX_COMPILER_TARGET=arm64-pc-windows-msvc

    steps:
      - name: Verify zith-lsp remote access
        shell: bash
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::RELEASE_PAT is missing. Configure the secret with access to GalaxyHaze/zith-lsp."
            exit 1
          fi

          if git ls-remote --exit-code "https://x-access-token:${TOKEN}@github.com/GalaxyHaze/zith-lsp.git" HEAD >/dev/null 2>&1; then
            echo "zith-lsp remote access OK"
          else
            echo "::error::Unable to access GalaxyHaze/zith-lsp with RELEASE_PAT. Check that the secret exists, has the required scopes, and collaborator access."
            exit 1
          fi
        env:
          TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Checkout zith-lsp
        uses: actions/checkout@v4
        with:
          repository: GalaxyHaze/zith-lsp
          ref: f09b56d0b093a2df114bfae819f4a92d1a62d375
          token: ${{ secrets.RELEASE_PAT }}
          path: lsp

      - name: Checkout Zith (local for ZITHC_SOURCE_DIR)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: zithc-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 lld-18 llvm-18-dev \
            zlib1g-dev libzstd-dev \
            libcurl4-openssl-dev libffi-dev libedit-dev libxml2-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm ninja

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Legacy LLVM installer (disabled)
        if: false
        shell: pwsh
        run: |
          choco install ninja -y
          $llvmVersion = '18.1.8'
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$llvmVersion-win64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-win64.exe" `
            -OutFile $installer
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/S', '/D=C:\Program Files\LLVM' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "LLVM installer failed with exit code $($process.ExitCode)"
          }

      - name: Install Windows ARM64 dependencies
        if: false
        shell: pwsh
        run: |
          choco install ninja -y
          $llvmVersion = '18.1.8'
          $releaseTag = 'llvm' + 'org' + [char]45 + $llvmVersion
          $assetName = "LLVM-$llvmVersion-woa64.exe"
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          $installerUri = "https://github.com/llvm/llvm-project/releases/download/$releaseTag/$assetName"
          Invoke-WebRequest -Uri $installerUri -OutFile $installer
          $process = Start-Process -FilePath $installer `
            -ArgumentList '/S', '/D=C:\Program Files\LLVM' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            throw "LLVM ARM64 installer failed with exit code $($process.ExitCode)"
          }

      - name: Install Windows LLVM development archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmVersion = '20.1.8'
          $llvmArch = switch ('${{ matrix.llvm_asset }}') {
            'win64' { 'x86_64' }
            'woa64' { 'aarch64' }
            default { throw "Unsupported LLVM Windows asset: ${{ matrix.llvm_asset }}" }
          }
          $assetName = "clang+llvm-$llvmVersion-$llvmArch-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP $assetName
          $releaseTag = 'llvm' + 'org' + [char]45 + $llvmVersion
          $assetUri = "https://github.com/llvm/llvm-project/releases/download/$releaseTag/$assetName"
          Invoke-WebRequest -Uri $assetUri -OutFile $archive

          $llvmRoot = 'C:\Program Files\LLVM'
          Remove-Item -LiteralPath $llvmRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $llvmRoot -Force | Out-Null
          tar.exe -xf $archive -C $llvmRoot --strip-components=1
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract LLVM archive: $assetName"
          }
          if (-not (Test-Path (Join-Path $llvmRoot 'bin\clang-cl.exe'))) {
            throw "LLVM archive did not contain clang-cl.exe: $assetName"
          }
          if (-not (Test-Path (Join-Path $llvmRoot 'lib\cmake\llvm\LLVMConfig.cmake'))) {
            throw "LLVM archive did not contain LLVMConfig.cmake: $assetName"
          }
          $clangVersion = & (Join-Path $llvmRoot 'bin\clang-cl.exe') --version |
            Select-Object -First 1
          if ($clangVersion -notmatch '^clang version 20\.') {
            throw "Expected Clang 20 from LLVM archive; got: $clangVersion"
          }

      - name: Download full-backend LLVM package
        if: matrix.os == 'windows-11-arm'
        uses: actions/download-artifact@v4
        with:
          name: llvm-windows-arm64-full-backends
          path: ${{ runner.temp }}\llvm-arm64-full

      - name: Merge full-backend LLVM package
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'llvm-arm64-full'
          $destination = 'C:\Program Files\LLVM'
          Copy-Item -Path (Join-Path $source '*') -Destination $destination -Recurse -Force
          foreach ($library in @(
            'LLVMX86CodeGen.lib',
            'LLVMAArch64CodeGen.lib',
            'LLVMWebAssemblyCodeGen.lib'
          )) {
            $path = Join-Path $destination "lib\$library"
            if (-not (Test-Path $path)) {
              throw "Merged LLVM package is missing $path"
            }
          }

      - name: Add LLVM to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"

      - name: Locate LLVM CMake package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files\LLVM',
            'C:\Program Files (x86)\LLVM',
            'C:\ProgramData\chocolatey\lib\llvm\tools',
            (Join-Path $env:ChocolateyInstall 'lib\llvm\tools')
          )
          $config = $null
          foreach ($root in $roots) {
            $candidate = Join-Path $root 'lib\cmake\llvm\LLVMConfig.cmake'
            if (Test-Path $candidate) {
              $config = Get-Item $candidate
              break
            }
          }
          if ($null -eq $config) {
            $llvmConfig = Get-Command llvm-config.exe -ErrorAction SilentlyContinue
            if ($null -ne $llvmConfig) {
              $cmakeDir = (& $llvmConfig.Source --cmakedir).Trim()
              $candidate = Join-Path $cmakeDir 'LLVMConfig.cmake'
              if (Test-Path $candidate) {
                $config = Get-Item $candidate
              }
            }
          }
          if ($null -ne $config) {
            "LLVM_DIR=$($config.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Using LLVM_DIR=$($config.DirectoryName)"
          } else {
            Write-Host 'LLVMConfig.cmake was not found; CMake will use CMAKE_PREFIX_PATH and llvm-config discovery'
          }

      - name: Setup MSVC environment
        if: runner.os == 'Windows' && matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Expose DIA SDK at LLVM's configured path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = '${{ matrix.msvc_arch }}'
          $source = Join-Path $env:VSINSTALLDIR "DIA SDK\lib\$arch\diaguids.lib"
          if (-not (Test-Path $source)) {
            throw "DIA SDK library was not found at $source"
          }

          $pattern = '(?i)[A-Za-z]:[/\\][^"]*?diaguids\.lib'
          $diaDestinations = @(
            Get-ChildItem -LiteralPath $env:LLVM_DIR -Filter '*.cmake' -File -Recurse |
              Select-String -Pattern $pattern |
              ForEach-Object {
                foreach ($match in $_.Matches) {
                  $match.Value -replace '/', '\'
                }
              }
          ) | Sort-Object -Unique
          if ($diaDestinations.Count -eq 0) {
            throw "LLVM CMake exports did not contain a DIA SDK library path under $env:LLVM_DIR"
          }

          foreach ($destination in $diaDestinations) {
            $sourcePath = [System.IO.Path]::GetFullPath($source)
            $destinationPath = [System.IO.Path]::GetFullPath($destination)
            if ($sourcePath.Equals(
                $destinationPath,
                [System.StringComparison]::OrdinalIgnoreCase
              )) {
              Write-Host "LLVM DIA SDK library already at configured path: $sourcePath"
              continue
            }

            $destinationDir = Split-Path -Parent $destination
            New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Force
            Write-Host "LLVM DIA SDK library: $source -> $destination"
          }

      - name: Clean stale build artifacts
        shell: bash
        working-directory: lsp
        run: rm -rf build

      - name: Configure zith-lsp
        shell: bash
        working-directory: lsp
        run: |
          SRC="${GITHUB_WORKSPACE//\\/\/}/zithc-src"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZITHC_SOURCE_DIR="${SRC}" \
            -DZITH_ENABLE_STRICT_WARNINGS=OFF \
            -DBUILD_TESTING=OFF \
            -DZITH_ENABLE_C_COMPILE=OFF \
            -DZITH_HAS_LLVM=ON \
            -DZITH_REQUIRE_LLVM=ON \
            ${{ matrix.cmake_flags }}

      - name: Verify LLVM configuration
        shell: bash
        working-directory: lsp
        run: python3 "${GITHUB_WORKSPACE}/zithc-src/scripts/verify-llvm-build.py" --build-dir build

      - name: Build zith-lsp
        shell: bash
        working-directory: lsp
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Run tests (Linux amd64 only)
        if: matrix.target_name == 'linux-amd64'
        shell: bash
        working-directory: lsp
        run: |
          cd tests
          python3 -m unittest test_lsp -v

      - name: Download macOS compiler for runtime packaging
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: compiler-zithc-${{ matrix.target_name }}
          path: compiler-artifact

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "macOS" ]; then
            compiler="compiler-artifact/zithc-${{ matrix.target_name }}"
            test -s "$compiler"
            runtime_dir="$RUNNER_TEMP/zith-macos-runtime"
            python3 zithc-src/scripts/package-macos-runtime.py \
              --binary "$compiler" \
              --binary lsp/build/zith-lsp \
              --runtime-dir "$runtime_dir"
            chmod +x "$compiler" lsp/build/zith-lsp
            cp "$compiler" "artifacts/zithc-${{ matrix.target_name }}"
            cp lsp/build/zith-lsp "artifacts/zith-lsp-${{ matrix.target_name }}"
            tar -czf "artifacts/zith-macos-runtime-${{ matrix.runtime_arch }}.tar.gz" \
              -C "$runtime_dir" lib manifest.json
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp lsp/build/zith-lsp.exe "artifacts/zith-lsp-${{ matrix.target_name }}"
          else
            chmod +x lsp/build/zith-lsp
            cp lsp/build/zith-lsp "artifacts/zith-lsp-${{ matrix.target_name }}"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag || inputs.tag_name }}
          files: artifacts/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wasm:
    needs: create-release
    name: Build zithc-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.65

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-wasm
          key: cmake-wasm-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'src/**/*.cpp', 'src/**/*.hpp') }}
          restore-keys: |
            cmake-wasm-

      - name: Configure CMake
        shell: bash
        run: |
          rm -f build-wasm/CMakeCache.txt build-wasm/CMakeFiles -rf 2>/dev/null || true
          emcmake cmake -S . -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DZITH_ENABLE_STRICT_WARNINGS=OFF \
            -DZITH_ENABLE_C_COMPILE=OFF \
            -DZITH_VERSION=${{ needs.create-release.outputs.tag || inputs.tag_name }} \
            -DCMAKE_CROSSCOMPILING=ON \
            -DZITH_IS_WASM=ON

      - name: Build
        shell: bash
        run: cmake --build build-wasm --config Release

      - name: Package browser stdlib
        shell: bash
        run: python3 scripts/package-stdlib.py stdlib build-wasm/zith-stdlib.pack

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts wasm-staging
          [ -d build-wasm/bin ] && cp build-wasm/bin/* wasm-staging/ || true
          find build-wasm -maxdepth 1 -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.html' -o -name '*.pack' \) -exec cp {} wasm-staging/ \;
          find build-wasm/src -type f -name '*.a' -exec cp {} wasm-staging/ \;
          if [ -z "$(ls wasm-staging)" ]; then echo "No WASM artifacts found"; exit 1; fi
          cd wasm-staging && zip -r ../artifacts/zithc-wasm.zip . && cd ..

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag || inputs.tag_name }}
          files: artifacts/zithc-wasm.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [create-release, release-maintenance, smoke-scoop]
    if: needs.create-release.outputs.draft == 'false'
    name: Publish verified release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release after all gates
        shell: bash
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
